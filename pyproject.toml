[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "darksky-duty"
version = "0.1.0"
description = "暗夜观测报名照明需求辨认、排班与确认码改派工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
darksky-duty = "darksky.cli:main"

[tool.setuptools]
packages = ["darksky"]
